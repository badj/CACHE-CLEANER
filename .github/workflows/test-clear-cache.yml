name: Test CLEAR-STREMIO-CACHE in Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 17 * * *'  # 5am NZT (UTC+12)
  workflow_dispatch:  # Allows manual trigger

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true

      - name: Install bats + core utils
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run bats tests
        working-directory: tests
        run: bats --tap --trace --timing test-clear-cache.bats

